name: Feature request
description: Suggest an improvement to Revo
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that Revo makes hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: How would you like it to work? Rough is fine.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety considerations
      description: Does this touch custody, approvals, caps or autonomous execution? If so, what should still be impossible after the change?
