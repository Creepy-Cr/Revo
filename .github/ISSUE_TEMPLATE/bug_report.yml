name: Bug report
description: Something in Revo does not behave as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. If this is a security issue, stop here and use
        private vulnerability reporting instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Sign in with ...
        2. Run the command ...
        3. Approve the proposal ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Console (web app)
        - API server
        - Policy engine or proposals
        - Deposits or withdrawals
        - Rebalance settlement
        - Arcus (agent)
        - Docs or marketing site
        - Other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: therevo.xyz or local build, browser and wallet used
  - type: textarea
    id: logs
    attributes:
      label: Logs, transaction hashes or screenshots
      description: Redact anything sensitive. Arc Testnet transaction hashes are welcome.
