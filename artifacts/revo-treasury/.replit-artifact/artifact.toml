kind = "web"
previewPath = "/"
title = "Revo Treasury"
description = "A production-intent Arc Testnet DAO treasury command center with wallet administration, live signals, policy governance, testnet custody, and Claude Opus 5 treasury intelligence."
version = "1.0.0"
id = "artifacts/revo-treasury"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19551

[services.development]
run = "pnpm --filter @workspace/revo-treasury run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/revo-treasury", "run", "build" ]
serve = "static"
publicDir = "artifacts/revo-treasury/dist/public"

[[services.production.rewrites]]
from = "/docs"
to = "/docs.html"

[[services.production.rewrites]]
from = "/docs/"
to = "/docs.html"

[[services.production.rewrites]]
from = "/privacy"
to = "/privacy.html"

[[services.production.rewrites]]
from = "/privacy/"
to = "/privacy.html"

[[services.production.rewrites]]
from = "/terms"
to = "/terms.html"

[[services.production.rewrites]]
from = "/terms/"
to = "/terms.html"

[[services.production.rewrites]]
from = "/risk"
to = "/risk.html"

[[services.production.rewrites]]
from = "/risk/"
to = "/risk.html"

[[services.production.rewrites]]
from = "/app"
to = "/app.html"

[[services.production.rewrites]]
from = "/app/"
to = "/app.html"

[[services.production.rewrites]]
from = "/dashboard"
to = "/dashboard.html"

[[services.production.rewrites]]
from = "/dashboard/"
to = "/dashboard.html"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19551"
BASE_PATH = "/"
