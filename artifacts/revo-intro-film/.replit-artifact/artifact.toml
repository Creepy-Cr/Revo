kind = "video"
previewPath = "/revo-intro-film/"
title = "Revo Introduction Film"
description = "A cinematic 16:9 introduction film for Revo, the AI-managed DAO treasury on Arc Testnet. Explains what Revo is and how it works: plain-English instructions compiled into enforced policies, guarded on-chain custody, deterministic guardrails, and operator control. Built for posting on X (Twitter)."
version = "1.0.0"
id = "artifacts/revo-intro-film"
router = "path"
videoAspectRatio = "16:9"

[[services]]
name = "web"
paths = [ "/revo-intro-film/" ]
localPort = 20077

[services.development]
run = "pnpm --filter @workspace/revo-intro-film run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/revo-intro-film", "run", "build" ]
serve = "static"
publicDir = "artifacts/revo-intro-film/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20077"
BASE_PATH = "/revo-intro-film/"
