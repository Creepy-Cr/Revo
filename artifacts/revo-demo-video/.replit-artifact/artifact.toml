kind = "video"
videoAspectRatio = "16:9"
previewPath = "/revo-demo-video/"
title = "Revo Treasury Demo Video"
description = "A polished 16:9 narrated product demonstration of Revo Treasury, showing the Arcus natural-language workflow, wallet-gated operator access, deterministic policy guardrails, proposal validation, and policy-gated execution on Arc mainnet."
version = "1.0.0"
id = "artifacts/revo-demo-video"
router = "path"

[[services]]
name = "web"
paths = [ "/revo-demo-video/" ]
localPort = 23301

[services.development]
run = "pnpm --filter @workspace/revo-demo-video run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/revo-demo-video", "run", "build" ]
serve = "static"
publicDir = "artifacts/revo-demo-video/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23301"
BASE_PATH = "/revo-demo-video/"
