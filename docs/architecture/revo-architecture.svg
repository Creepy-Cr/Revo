<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1190" viewBox="0 0 1680 1190" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FC3B00"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6B6B6B"/>
    </marker>
    <linearGradient id="hg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FC3B00"/>
      <stop offset="100%" stop-color="#FF6129"/>
    </linearGradient>
  </defs>

  <rect width="1680" height="1190" fill="#000000"/>

  <!-- ================= HEADER ================= -->
  <rect x="40" y="36" width="6" height="60" rx="3" fill="url(#hg)"/>
  <text x="66" y="70" font-size="30" font-weight="700" fill="#FFFFFF" letter-spacing="1">REVO</text>
  <text x="66" y="92" font-size="14" fill="#B8B8B8">Autonomous Treasury Intelligence — system architecture</text>
  <text x="1640" y="62" font-size="13" text-anchor="end" fill="#FC3B00" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Arc Testnet · chainId 5042002</text>
  <text x="1640" y="84" font-size="12" text-anchor="end" fill="#7A7A7A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">native USDC 0x3600…0000 · 6 decimals</text>
  <line x1="40" y1="116" x2="1640" y2="116" stroke="#212121" stroke-width="1"/>

  <!-- ================= 01 IDENTITY ================= -->
  <rect x="40" y="140" width="1160" height="150" rx="12" fill="#0A0A0A" stroke="#212121"/>
  <text x="62" y="170" font-size="12" font-weight="600" fill="#FC3B00" letter-spacing="1.6">01 · IDENTITY PLANE</text>

  <rect x="62" y="186" width="340" height="62" rx="10" fill="#111111" stroke="#2A2A2A"/>
  <text x="80" y="212" font-size="15" font-weight="600" fill="#FFFFFF">Browser Wallet</text>
  <text x="80" y="232" font-size="12" fill="#8A8A8A">EIP-6963 injected discovery</text>

  <rect x="440" y="186" width="340" height="62" rx="10" fill="#111111" stroke="#2A2A2A"/>
  <text x="458" y="212" font-size="15" font-weight="600" fill="#FFFFFF">Wallet Sign-In</text>
  <text x="458" y="232" font-size="12" fill="#8A8A8A">EIP-191 nonce → signature verify</text>

  <rect x="818" y="186" width="340" height="62" rx="10" fill="#111111" stroke="#2A2A2A"/>
  <text x="836" y="212" font-size="15" font-weight="600" fill="#FFFFFF">Server Session</text>
  <text x="836" y="232" font-size="12" fill="#8A8A8A">HttpOnly cookie · treasury-scoped</text>

  <line x1="406" y1="217" x2="434" y2="217" stroke="#FC3B00" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="784" y1="217" x2="812" y2="217" stroke="#FC3B00" stroke-width="1.6" marker-end="url(#ar)"/>

  <text x="62" y="274" font-size="12" fill="#7A7A7A" letter-spacing="0.6">ROLES   Strategist  ·  Approver  ·  Guardian      —  every protected query scoped to the operator's treasury</text>

  <!-- ================= 02 DECISION ================= -->
  <rect x="40" y="314" width="1160" height="340" rx="12" fill="#0A0A0A" stroke="#212121"/>
  <text x="62" y="344" font-size="12" font-weight="600" fill="#FC3B00" letter-spacing="1.6">02 · DECISION PLANE — api-server (Express)</text>

  <rect x="62" y="360" width="550" height="66" rx="10" fill="#111111" stroke="#2A2A2A"/>
  <text x="80" y="388" font-size="15" font-weight="600" fill="#FFFFFF">Arcus · Policy Compiler</text>
  <text x="80" y="409" font-size="12" fill="#8A8A8A">Claude · natural language → draft policy · one-shot</text>

  <rect x="632" y="360" width="526" height="66" rx="10" fill="#111111" stroke="#2A2A2A"/>
  <text x="650" y="388" font-size="15" font-weight="600" fill="#FFFFFF">Arcus · Grounded Q&amp;A</text>
  <text x="650" y="409" font-size="12" fill="#8A8A8A">explains live state · no execution authority</text>

  <line x1="337" y1="430" x2="337" y2="450" stroke="#FC3B00" stroke-width="1.6" marker-end="url(#ar)"/>

  <rect x="62" y="452" width="1096" height="76" rx="10" fill="#111111" stroke="#FC3B00" stroke-opacity="0.45"/>
  <text x="80" y="482" font-size="16" font-weight="600" fill="#FFFFFF">Deterministic Policy Engine</text>
  <text x="80" y="505" font-size="12" fill="#8A8A8A">server-clamped guardrails — max allocation 5–35%  ·  min liquid reserve 25–80%  ·  max drawdown 5–30%  ·  LLM values never trusted raw</text>

  <line x1="337" y1="532" x2="337" y2="554" stroke="#FC3B00" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="1002" y1="532" x2="1002" y2="554" stroke="#6B6B6B" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ag)"/>

  <rect x="62" y="556" width="356" height="76" rx="10" fill="#111111" stroke="#2A2A2A"/>
  <text x="80" y="584" font-size="15" font-weight="600" fill="#FFFFFF">Proposal Lifecycle</text>
  <text x="80" y="605" font-size="12" fill="#8A8A8A">draft → approve → execute</text>
  <text x="80" y="622" font-size="12" fill="#8A8A8A">one active policy · supersedes prior</text>

  <rect x="444" y="556" width="356" height="76" rx="10" fill="#111111" stroke="#2A2A2A"/>
  <text x="462" y="584" font-size="15" font-weight="600" fill="#FFFFFF">Operating Modes</text>
  <text x="462" y="605" font-size="12" fill="#8A8A8A">Managed — human approval gate</text>
  <text x="462" y="622" font-size="12" fill="#8A8A8A">Autonomous — in-policy only</text>

  <rect x="826" y="556" width="332" height="76" rx="10" fill="#0D0D0D" stroke="#6B6B6B" stroke-dasharray="5 4"/>
  <text x="844" y="584" font-size="15" font-weight="600" fill="#B8B8B8">Simulated Rebalance</text>
  <text x="844" y="605" font-size="12" fill="#7A7A7A">USDC / aUSDC / sUSDC / ETH sleeves</text>
  <text x="844" y="622" font-size="12" fill="#7A7A7A">internal accounting — not a swap</text>

  <!-- ================= 03 SETTLEMENT ================= -->
  <rect x="40" y="678" width="1160" height="330" rx="12" fill="#0A0A0A" stroke="#FC3B00" stroke-opacity="0.3"/>
  <text x="62" y="708" font-size="12" font-weight="600" fill="#FC3B00" letter-spacing="1.6">03 · SETTLEMENT PLANE — Arc Testnet · REAL ON-CHAIN</text>

  <text x="62" y="740" font-size="12" font-weight="600" fill="#8A8A8A" letter-spacing="1.2">DEPOSIT</text>
  <rect x="62" y="752" width="250" height="58" rx="9" fill="#111111" stroke="#2A2A2A"/>
  <text x="78" y="776" font-size="13.5" font-weight="600" fill="#FFFFFF">User wallet</text>
  <text x="78" y="795" font-size="11.5" fill="#8A8A8A">signs in browser</text>

  <rect x="352" y="752" width="250" height="58" rx="9" fill="#111111" stroke="#2A2A2A"/>
  <text x="368" y="776" font-size="13.5" font-weight="600" fill="#FFFFFF">USDC transfer()</text>
  <text x="368" y="795" font-size="11.5" fill="#8A8A8A">ERC-20 → treasury address</text>

  <rect x="642" y="752" width="250" height="58" rx="9" fill="#111111" stroke="#2A2A2A"/>
  <text x="658" y="776" font-size="13.5" font-weight="600" fill="#FFFFFF">Log verify · 12 conf</text>
  <text x="658" y="795" font-size="11.5" fill="#8A8A8A">indexer · reorg rewind</text>

  <rect x="932" y="752" width="226" height="58" rx="9" fill="#111111" stroke="#2A2A2A"/>
  <text x="948" y="776" font-size="13.5" font-weight="600" fill="#FFFFFF">Credit balance</text>
  <text x="948" y="795" font-size="11.5" fill="#8A8A8A">idempotent by tx hash</text>

  <line x1="316" y1="781" x2="346" y2="781" stroke="#FC3B00" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="606" y1="781" x2="636" y2="781" stroke="#FC3B00" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="896" y1="781" x2="926" y2="781" stroke="#FC3B00" stroke-width="1.6" marker-end="url(#ar)"/>

  <text x="62" y="854" font-size="12" font-weight="600" fill="#8A8A8A" letter-spacing="1.2">WITHDRAW</text>
  <rect x="62" y="866" width="200" height="58" rx="9" fill="#111111" stroke="#2A2A2A"/>
  <text x="76" y="890" font-size="13" font-weight="600" fill="#FFFFFF">Destination auth</text>
  <text x="76" y="909" font-size="11.5" fill="#8A8A8A">EIP-191 · 5 min TTL</text>

  <rect x="292" y="866" width="200" height="58" rx="9" fill="#111111" stroke="#2A2A2A"/>
  <text x="306" y="890" font-size="13" font-weight="600" fill="#FFFFFF">Reserve balance</text>
  <text x="306" y="909" font-size="11.5" fill="#8A8A8A">transactional lock</text>

  <rect x="522" y="866" width="200" height="58" rx="9" fill="#111111" stroke="#2A2A2A"/>
  <text x="536" y="890" font-size="13" font-weight="600" fill="#FFFFFF">Custody sign</text>
  <text x="536" y="909" font-size="11.5" fill="#8A8A8A">EIP-1559 · local</text>

  <rect x="752" y="866" width="200" height="58" rx="9" fill="#111111" stroke="#2A2A2A"/>
  <text x="766" y="890" font-size="13" font-weight="600" fill="#FFFFFF">Broadcast</text>
  <text x="766" y="909" font-size="11.5" fill="#8A8A8A">sendRawTransaction</text>

  <rect x="982" y="866" width="176" height="58" rx="9" fill="#111111" stroke="#2A2A2A"/>
  <text x="996" y="890" font-size="13" font-weight="600" fill="#FFFFFF">Reconcile</text>
  <text x="996" y="909" font-size="11.5" fill="#8A8A8A">confirm or refund</text>

  <line x1="266" y1="895" x2="286" y2="895" stroke="#FC3B00" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="496" y1="895" x2="516" y2="895" stroke="#FC3B00" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="726" y1="895" x2="746" y2="895" stroke="#FC3B00" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="956" y1="895" x2="976" y2="895" stroke="#FC3B00" stroke-width="1.6" marker-end="url(#ar)"/>

  <text x="62" y="962" font-size="11.5" fill="#7A7A7A">Chain guard rejects any chainId other than 5042002 before every read and every broadcast.</text>
  <text x="62" y="984" font-size="11.5" fill="#7A7A7A">Custody key is unsealed in memory only for a single signing call and is never persisted in plaintext.</text>

  <!-- ================= 04 WORKERS ================= -->
  <rect x="40" y="1032" width="1160" height="118" rx="12" fill="#0A0A0A" stroke="#212121"/>
  <text x="62" y="1060" font-size="12" font-weight="600" fill="#FC3B00" letter-spacing="1.6">04 · DURABLE WORKERS — single leader · lease + fencing · 15s tick</text>

  <rect x="62" y="1074" width="356" height="58" rx="9" fill="#111111" stroke="#2A2A2A"/>
  <text x="80" y="1098" font-size="13.5" font-weight="600" fill="#FFFFFF">deposit-indexer · 30s</text>
  <text x="80" y="1117" font-size="11.5" fill="#8A8A8A">scan logs · backfill 5000 blocks · reorg rewind</text>

  <rect x="444" y="1074" width="356" height="58" rx="9" fill="#111111" stroke="#2A2A2A"/>
  <text x="462" y="1098" font-size="13.5" font-weight="600" fill="#FFFFFF">withdrawal-reconciler · 30s</text>
  <text x="462" y="1117" font-size="11.5" fill="#8A8A8A">resolve pending · confirm or refund · alert</text>

  <rect x="826" y="1074" width="332" height="58" rx="9" fill="#111111" stroke="#2A2A2A"/>
  <text x="844" y="1098" font-size="13.5" font-weight="600" fill="#FFFFFF">drawdown-monitor · 60s</text>
  <text x="844" y="1117" font-size="11.5" fill="#8A8A8A">NAV vs peak · alert only, no auto-trade</text>

  <!-- ================= SIGNALS ================= -->
  <rect x="1224" y="140" width="416" height="280" rx="12" fill="#0A0A0A" stroke="#212121"/>
  <text x="1246" y="170" font-size="12" font-weight="600" fill="#FC3B00" letter-spacing="1.6">SIGNAL INPUTS · read-only</text>

  <circle cx="1252" cy="200" r="3" fill="#FC3B00"/><text x="1266" y="205" font-size="13" fill="#D8D8D8">CoinGecko quote</text>
  <circle cx="1252" cy="234" r="3" fill="#FC3B00"/><text x="1266" y="239" font-size="13" fill="#D8D8D8">ETH momentum</text>
  <circle cx="1252" cy="268" r="3" fill="#FC3B00"/><text x="1266" y="273" font-size="13" fill="#D8D8D8">USDC peg deviation</text>
  <circle cx="1252" cy="302" r="3" fill="#FC3B00"/><text x="1266" y="307" font-size="13" fill="#D8D8D8">Arc whale watch — USDC transfers</text>
  <circle cx="1252" cy="336" r="3" fill="#FC3B00"/><text x="1266" y="341" font-size="13" fill="#D8D8D8">GitHub repository activity</text>
  <circle cx="1252" cy="370" r="3" fill="#FC3B00"/><text x="1266" y="375" font-size="13" fill="#D8D8D8">Crypto news RSS</text>

  <text x="1246" y="404" font-size="11.5" fill="#7A7A7A">Grounds Arcus answers. Not a policy or risk-score input.</text>

  <line x1="1218" y1="390" x2="1206" y2="390" stroke="#FC3B00" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- ================= CUSTODY & CONTROLS ================= -->
  <rect x="1224" y="444" width="416" height="300" rx="12" fill="#0A0A0A" stroke="#212121"/>
  <text x="1246" y="474" font-size="12" font-weight="600" fill="#FC3B00" letter-spacing="1.6">CUSTODY &amp; CONTROLS</text>

  <text x="1246" y="506" font-size="13" fill="#D8D8D8">AES-256-GCM envelope encryption</text>
  <text x="1246" y="532" font-size="13" fill="#D8D8D8">DEK wrapped by HKDF-SHA256 master</text>
  <text x="1246" y="558" font-size="13" fill="#D8D8D8">Key unsealed only at signing</text>

  <line x1="1246" y1="578" x2="1618" y2="578" stroke="#212121"/>

  <text x="1246" y="606" font-size="13" fill="#D8D8D8">Withdrawal caps</text>
  <text x="1246" y="628" font-size="12" fill="#8A8A8A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">25k / tx   ·   50k / wallet 24h   ·   100k global</text>

  <text x="1246" y="660" font-size="13" fill="#D8D8D8">Safe mode · Emergency pause</text>
  <text x="1246" y="686" font-size="13" fill="#D8D8D8">Role-based approval + audit export</text>
  <text x="1246" y="712" font-size="12" fill="#7A7A7A">Pause blocks approvals, execution, withdrawals.</text>

  <!-- ================= STATE ================= -->
  <rect x="1224" y="768" width="416" height="130" rx="12" fill="#0A0A0A" stroke="#212121"/>
  <text x="1246" y="798" font-size="12" font-weight="600" fill="#FC3B00" letter-spacing="1.6">STATE</text>
  <text x="1246" y="828" font-size="13" fill="#D8D8D8">PostgreSQL · Drizzle ORM</text>
  <text x="1246" y="852" font-size="12" fill="#8A8A8A">holdings · policies · proposals · activity · audit</text>
  <text x="1246" y="876" font-size="12" fill="#8A8A8A">transactional balance reservation</text>

  <!-- ================= LEGEND ================= -->
  <rect x="1224" y="922" width="416" height="228" rx="12" fill="#0A0A0A" stroke="#212121"/>
  <text x="1246" y="952" font-size="12" font-weight="600" fill="#FC3B00" letter-spacing="1.6">LEGEND</text>

  <line x1="1246" y1="978" x2="1290" y2="978" stroke="#FC3B00" stroke-width="2" marker-end="url(#ar)"/>
  <text x="1302" y="983" font-size="13" fill="#D8D8D8">Real Arc Testnet transaction</text>

  <line x1="1246" y1="1008" x2="1290" y2="1008" stroke="#6B6B6B" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ag)"/>
  <text x="1302" y="1013" font-size="13" fill="#D8D8D8">Internal accounting — simulated</text>

  <rect x="1246" y="1032" width="372" height="98" rx="9" fill="#0D0D0D" stroke="#2A2A2A"/>
  <text x="1262" y="1056" font-size="11.5" fill="#B8B8B8">Deposits and withdrawals are real on-chain USDC</text>
  <text x="1262" y="1075" font-size="11.5" fill="#B8B8B8">transfers on Arc Testnet. Strategic rebalances are</text>
  <text x="1262" y="1094" font-size="11.5" fill="#B8B8B8">internal accounting targets and are never presented</text>
  <text x="1262" y="1113" font-size="11.5" fill="#B8B8B8">as on-chain execution.</text>
</svg>
